<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <style>
    .headline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #f8fafc; }
    .subtext { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #94a3b8; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 10px; font-weight: 700; }
    .bignum { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 28px; font-weight: 800; }
  </style>

  <rect width="860" height="440" rx="16" fill="url(#bg4)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="40" y="44" class="headline">From Slow Cloud API Bills to Free Instant Local Code</text>
  <text x="40" y="64" class="subtext">How LLM Distiller extracts the decision pattern from prompt logs and writes a 0.08ms replacement.</text>

  <!-- Left: Sluggish Cloud API -->
  <g transform="translate(40, 95)">
    <rect width="360" height="270" rx="12" fill="#1c1114" stroke="#991b1b" stroke-width="1.5"/>
    <rect x="16" y="16" width="130" height="20" rx="4" fill="#ef4444" opacity="0.2"/>
    <text x="24" y="30" class="badge" fill="#f87171">BEFORE: CLOUD LLM</text>

    <text x="16" y="70" class="mono" fill="#fca5a5">Task: Support intent tagging</text>
    <text x="16" y="90" class="subtext">Calling external API over the internet</text>

    <!-- Stat 1 -->
    <rect x="16" y="115" width="328" height="60" rx="8" fill="#2d1519"/>
    <text x="30" y="145" class="bignum" fill="#f87171">1,500 ms</text>
    <text x="30" y="164" class="subtext">Users stare at spinning wheel</text>

    <!-- Stat 2 -->
    <rect x="16" y="185" width="328" height="60" rx="8" fill="#2d1519"/>
    <text x="30" y="215" class="bignum" fill="#f87171">$7,200 / yr</text>
    <text x="30" y="234" class="subtext">Wasted on repetitive classification tokens</text>

    <text x="16" y="262" class="mono" fill="#ef4444">Rate limits &amp; occasional hallucinations</text>
  </g>

  <!-- Center Arrow -->
  <g transform="translate(415, 205)">
    <circle cx="15" cy="15" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="8" y="20" class="headline" font-size="14" fill="#60a5fa">&gt;</text>
    <text x="-15" y="48" class="badge" fill="#94a3b8">DISTILL</text>
  </g>

  <!-- Right: Distilled Instant Function -->
  <g transform="translate(460, 95)">
    <rect width="360" height="270" rx="12" fill="#081c15" stroke="#059669" stroke-width="2"/>
    <rect x="16" y="16" width="150" height="20" rx="4" fill="#10b981" opacity="0.2"/>
    <text x="24" y="30" class="badge" fill="#34d399">AFTER: COMPILED CODE</text>

    <text x="16" y="70" class="mono" fill="#86efac">Pure Python / TS decision tree</text>
    <text x="16" y="90" class="subtext">Extracted via mutual information tokens</text>

    <!-- Stat 1 -->
    <rect x="16" y="115" width="328" height="60" rx="8" fill="#063826"/>
    <text x="30" y="145" class="bignum" fill="#34d399">0.08 ms</text>
    <text x="30" y="164" class="subtext">15,000x faster (zero user wait time)</text>

    <!-- Stat 2 -->
    <rect x="16" y="185" width="328" height="60" rx="8" fill="#063826"/>
    <text x="30" y="215" class="bignum" fill="#34d399">$0.00 / yr</text>
    <text x="30" y="234" class="subtext">Runs 100% locally with zero cloud tokens</text>

    <text x="16" y="262" class="mono" fill="#34d399">99.8% Ground truth parity guaranteed</text>
  </g>

  <!-- Bottom strip -->
  <rect x="40" y="390" width="780" height="34" rx="6" fill="#030712" stroke="#1f2937"/>
  <circle cx="58" cy="407" r="4" fill="#10b981"/>
  <text x="74" y="411" class="mono" fill="#94a3b8">Save thousands of dollars by turning repetitive AI prompts into free local functions.</text>
</svg>
